[theme]
# V8 "The Drop" - High-End Streetwear Aesthetic
primaryColor = "#ccff00"          # Safety Yellow / Volt
backgroundColor = "#050505"       # Studio Black
secondaryBackgroundColor = "#0F0F0F"  # Card Black
textColor = "#ffffff"             # Pure White
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = false
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
