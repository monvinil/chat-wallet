[theme]
# Professional dark theme
primaryColor = "#3B82F6"          # Vibrant blue - action buttons, links
backgroundColor = "#0F0F14"       # Deep dark background
secondaryBackgroundColor = "#1A1A24"  # Elevated cards/sections
textColor = "#E5E7EB"             # Light gray text
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
