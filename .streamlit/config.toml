[theme]
# V6 "Obsidian Standard" - Linear/Stripe Fintech Aesthetic
primaryColor = "#5E6AD2"          # Blurple brand accent
backgroundColor = "#08090A"       # App background
secondaryBackgroundColor = "#121315"  # Panel background
textColor = "#EDEDEF"             # Primary text
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = false
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
