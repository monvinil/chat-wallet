[theme]
# V3 "Opinionated Luxury" - Cyber-Physical Design System
primaryColor = "#a3e635"          # Lime-400 accent
backgroundColor = "#050505"       # Void black
secondaryBackgroundColor = "#0A0A0B"  # Panel dark
textColor = "#e4e4e7"             # Zinc-200 text
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = false
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
