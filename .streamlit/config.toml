[theme]
# 2026 Cyber-Physical Design System
# Deep void backgrounds, not flat black
primaryColor = "#00D4FF"              # Electric cyan accent
backgroundColor = "#020408"           # Deep rich void
secondaryBackgroundColor = "#0A0D14"  # Elevated surfaces
textColor = "#E8ECF4"                 # Cool white text
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = false
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
