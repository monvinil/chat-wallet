[theme]
# V7 "The Construct" - Industrial High-Fidelity Aesthetic
primaryColor = "#bef264"          # Acid Lime accent
backgroundColor = "#09090b"       # Deep charcoal
secondaryBackgroundColor = "#18181b"  # Panel (Zinc-900)
textColor = "#f4f4f5"             # Primary text (Zinc-100)
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = false
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
