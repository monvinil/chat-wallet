[theme]
# V5 "Neural Vault" - Electric Violet/Cyan
primaryColor = "#8b5cf6"          # Violet-500 accent
backgroundColor = "#020204"       # Deep void
secondaryBackgroundColor = "#0A0A0C"  # Panel dark
textColor = "#e2e8f0"             # Slate-200 text
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = false
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
