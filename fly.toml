# =============================================================================
# Fly.io Configuration - USDChat API
# Deploy: fly deploy --config fly.toml
# =============================================================================

app = "usdchat-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.api.production"

[env]
  API_DEBUG = "false"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"
  cpus = 2

# Scaling: start with 1 machine, scale up as needed
# fly scale count 2 --config fly.toml
